<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckStock</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; color: #222; background: #f6f5f2; }
  header { background: #234; color: #fff; padding: 10px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header a { color: #cde; text-decoration: none; } header a:hover { color: #fff; }
  header b { font-size: 17px; margin-right: 10px; }
  main { padding: 16px 20px; max-width: 1200px; }
  h2 { font-size: 16px; margin: 22px 0 6px; }
  .hint { color: #666; margin: 0 0 8px; }
  table { border-collapse: collapse; background: #fff; width: 100%; margin-bottom: 8px; }
  th, td { border: 1px solid #ddd; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #eef0f2; font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .flash { padding: 8px 12px; margin-bottom: 12px; border-radius: 4px; }
  .ok { background: #e3f4e1; } .err { background: #fbe3e1; }
  .card { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  form.inline { display: inline; }
  label { display: block; margin: 6px 0; } input, select { font: inherit; padding: 3px; }
  button { font: inherit; padding: 3px 10px; cursor: pointer; }
  .tag { font-size: 12px; padding: 1px 6px; border-radius: 3px; background: #fde7c8; }
  .muted { color: #999; } .bad { color: #b00; font-weight: 600; } .good { color: #080; }
</style>
</head>
<body>
<header>
  <b>CheckStock</b>
  <a href="/">Остатки</a>
  <a href="/ops">Операции</a>
  <a href="/warehouses">Склады ФФ</a>
  <a href="/history">История</a>
</header>
<main>
  {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
