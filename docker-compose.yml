services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "checkstock"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://checkstock:checkstock@db:5432/checkstock
      TEST_DATABASE_URL: postgresql://checkstock:checkstock@db:5432/checkstock_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
